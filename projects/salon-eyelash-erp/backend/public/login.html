<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <title>Login - Salon Eyelash ERP</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--rose:#D48989;--rose-light:#E8B4B4;--rose-dark:#B86B6B;--blush:#FFF5F5;--blush-2:#FFEEEE;--mauve:#8B5E83;--lavender:#B8A9C9;--cream:#FFFAF5;--white:#FFFFFF;--text:#3D2B2B;--text-light:#8A7A7A;--text-muted:#B5A5A5;--shadow:0 4px 24px rgba(180,120,120,0.10);--shadow-hover:0 8px 32px rgba(180,120,120,0.18);--radius:16px;--radius-sm:10px;--radius-xs:8px;--header-font:'Playfair Display',Georgia,serif;--body-font:'Inter',-apple-system,sans-serif;--transition:0.25s cubic-bezier(0.4,0,0.2,1)}
    html,body{height:100%}
    body{
      font-family:var(--body-font);
      background:linear-gradient(135deg,var(--blush) 0%,var(--blush-2) 50%,#FFF0F0 100%);
      display:flex;align-items:center;justify-content:center;
      min-height:100vh;padding:20px;
    }
    .login-card{
      background:var(--white);
      border-radius:var(--radius);
      padding:48px 40px 40px;
      box-shadow:var(--shadow-hover);
      width:100%;max-width:400px;
      text-align:center;
    }
    .login-icon{
      width:72px;height:72px;
      background:linear-gradient(135deg,var(--rose),var(--mauve));
      border-radius:20px;
      display:flex;align-items:center;justify-content:center;
      margin:0 auto 20px;
      font-size:32px;color:white;
    }
    .login-title{
      font-family:var(--header-font);
      font-size:24px;font-weight:700;
      color:var(--text);
      margin-bottom:4px;
    }
    .login-sub{
      font-size:14px;color:var(--text-light);
      margin-bottom:32px;
    }
    .form-group{
      margin-bottom:20px;
      text-align:left;
    }
    .form-group label{
      display:block;
      font-size:13px;font-weight:600;
      color:var(--text);
      margin-bottom:6px;
    }
    .input-wrap{
      position:relative;
    }
    .input-wrap i{
      position:absolute;
      left:14px;top:50%;
      transform:translateY(-50%);
      color:var(--text-muted);
      font-size:16px;
    }
    input{
      width:100%;
      padding:12px 14px 12px 44px;
      border:1.5px solid rgba(212,137,137,0.2);
      border-radius:var(--radius-xs);
      font-family:var(--body-font);
      font-size:14px;
      color:var(--text);
      background:var(--white);
      transition:var(--transition);
      outline:none;
    }
    input:focus{
      border-color:var(--rose);
      box-shadow:0 0 0 3px rgba(212,137,137,0.15);
    }
    .btn{
      display:inline-flex;
      align-items:center;justify-content:center;
      gap:10px;
      width:100%;
      padding:13px 20px;
      border:none;
      border-radius:var(--radius-xs);
      font-family:var(--body-font);
      font-size:15px;font-weight:600;
      cursor:pointer;
      transition:var(--transition);
      line-height:1;
    }
    .btn-primary{
      background:linear-gradient(135deg,var(--rose),var(--rose-dark));
      color:white;
    }
    .btn-primary:hover{
      transform:translateY(-1px);
      box-shadow:0 4px 16px rgba(212,137,137,0.35);
    }
    .btn-primary:disabled{
      opacity:0.5;cursor:not-allowed;
      transform:none;box-shadow:none;
    }
    .spinner{
      width:18px;height:18px;
      border:2.5px solid rgba(255,255,255,0.3);
      border-top-color:white;
      border-radius:50%;
      animation:spin 0.8s linear infinite;
      display:inline-block;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .status-box{
      display:none;
      padding:12px 16px;
      border-radius:var(--radius-sm);
      margin-bottom:20px;
      font-size:13px;font-weight:500;
      line-height:1.4;
    }
    .status-box.show{display:block}
    .status-box.error{background:#FDE8E8;color:#991B1B;border-left:4px solid #991B1B}
    .status-box.success{background:#E8F7EC;color:#166534;border-left:4px solid #166534}
    .footer{
      margin-top:28px;
      font-size:12px;
      color:var(--text-muted);
    }
    .footer span{color:var(--rose)}
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-icon"><i class="fa-solid fa-sparkles"></i></div>
    <div class="login-title">Salon Eyelash</div>
    <div class="login-sub">Masuk ke POS & ERP System</div>

    <div id="statusBox" class="status-box"></div>

    <div class="form-group">
      <label>Username</label>
      <div class="input-wrap">
        <i class="fa-solid fa-user"></i>
        <input id="username" type="text" placeholder="Masukkan username" autocomplete="username" autofocus>
      </div>
    </div>

    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <i class="fa-solid fa-lock"></i>
        <input id="password" type="password" placeholder="Masukkan password" autocomplete="current-password">
      </div>
    </div>

    <button id="loginBtn" class="btn btn-primary" onclick="doLogin()">
      <i class="fa-solid fa-right-to-bracket"></i> Masuk
    </button>

    <div class="footer">
      Salon Eyelash ERP <span>✦</span> v3.0
    </div>
  </div>

  <script>
    const API = window.location.origin;

    // Enter key to login
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });

    async function doLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const status = document.getElementById('statusBox');

      if (!username || !password) {
        showStatus(status, 'error', 'Username dan password wajib diisi');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Masuk...';

      try {
        const res = await fetch(API + '/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (!data.success) {
          showStatus(status, 'error', data.message || 'Login gagal');
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Masuk';
          return;
        }

        // Save token + user info
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        showStatus(status, 'success', 'Login berhasil! Mengalihkan...');

        setTimeout(() => {
          window.location.href = '/';
        }, 500);
      } catch (e) {
        showStatus(status, 'error', 'Gagal terhubung ke server');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Masuk';
      }
    }

    function showStatus(el, type, msg) {
      el.className = 'status-box show ' + type;
      el.textContent = msg;
    }
  </script>
</body>
</html>
