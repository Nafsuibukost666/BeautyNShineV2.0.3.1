server {
    listen 8080;
    server_name _;

    # Redirect root to POS
    location = / {
        return 301 /pos/;
    }

    # Redirect /pos without trailing slash
    location = /pos {
        return 301 /pos/;
    }

    # ===== POS EXPO API Proxy (to ERP FastAPI) =====
    location /api/ {
        rewrite ^/api/(.*)$ /erp/api/v1/$1 break;
        proxy_pass http://localhost:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== POS EXPO Frontend Assets =====
    # Expo build uses absolute paths like /_expo/static/js/web/...
    # Serve these from the Expo dist directory
    location /_expo/ {
        alias /home/ubuntu/salon-eyelash-v2/apps/pos/dist/_expo/;
    }

    # ===== POS EXPO Frontend =====
    location /pos-expo/ {
        alias /home/ubuntu/salon-eyelash-v2/apps/pos/dist/;
        try_files $uri $uri/ /pos-expo/index.html;
    }

    # ===== POS LITE Frontend =====
    location /pos/ {
        alias /home/ubuntu/salon-eyelash-v2/apps/pos-lite/frontend/dist/;
        try_files $uri $uri/ /pos/index.html;
    }

    # ===== POS LITE API Proxy =====
    location /pos/api/ {
        proxy_pass http://localhost:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== ERP Frontend =====
    location /erp {
        return 301 /erp/;
    }

    location /erp/ {
        alias /home/ubuntu/salon-eyelash-v2/apps/erp-core/frontend/dist/;
        try_files $uri $uri/ /erp/index.html;
    }

    # ===== ERP API Proxy (Python FastAPI) with v1 path rewrite =====
    location /erp/api/ {
        rewrite ^/erp/api/(.*)$ /erp/api/v1/$1 break;
        proxy_pass http://localhost:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
