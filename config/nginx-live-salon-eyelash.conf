server {
    listen 8080;
    server_name _;

    # Redirect root to ERP
    location = / {
        return 301 /erp/;
    }

    # ===== POS Frontend (Expo) =====
    location /pos {
        return 301 /pos/;
    }

    location /pos/ {
        alias /home/ubuntu/salon-eyelash-v2/apps/pos/dist/;
        try_files $uri $uri/ /pos/index.html;
    }

    # ===== POS Assets (Expo) =====
    location /_expo/ {
        alias /home/ubuntu/salon-eyelash-v2/apps/pos/dist/_expo/;
    }

    # ===== ERP Frontend =====
    location /erp {
        return 301 /erp/;
    }

    location /erp/ {
        alias /home/ubuntu/salon-eyelash-v2/apps/erp-core/frontend/dist/;
        try_files $uri $uri/ /erp/index.html;
    }

    # ===== ERP API Proxy (Python FastAPI) =====
    location /erp/api/ {
        rewrite ^/erp/api/(.*)$ /erp/api/v1/$1 break;
        proxy_pass http://localhost:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== POS API Proxy (to ERP FastAPI) =====
    location /api/ {
        rewrite ^/api/(.*)$ /erp/api/v1/$1 break;
        proxy_pass http://localhost:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
